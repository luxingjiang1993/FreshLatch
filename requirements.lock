# 传递依赖锁。CI 仍是 `pip install -e ".[dev]"`，本文件不参与安装。
# Docker 镜像以后做复现包时再基于此锁文件，本票不加镜像。
#
# `uv pip compile requirements.txt --universal` 解不出：fastembed==0.8.1 在 Python>=3.14
# 上要求 pillow>=12，而 requirements.txt 钉 pillow==11.3.0。不改 requires-python，也不改直接钉。
# 下面两条都钉 CPython 3.11。Windows 多出的传递包用 sys_platform == "win32" 并进本文件：
#    uv pip compile requirements.txt --python-version 3.11 --python-platform x86_64-unknown-linux-gnu -o requirements.lock
#    uv pip compile requirements.txt --python-version 3.11 --python-platform x86_64-pc-windows-msvc -o requirements.lock

